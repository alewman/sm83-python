[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sm83-python"
version = "0.1.0.dev0"
description = "Readable, pure-Python Sharp SM83 (Game Boy CPU) instruction-core reference implementation"
readme = "README.md"
# The floor is the newest Python PyPy supports (3.11 as of PyPy 7.3.23); raise it when PyPy does.
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "alewman" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Emulators",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/alewman/sm83-python"
Repository = "https://github.com/alewman/sm83-python"
Issues = "https://github.com/alewman/sm83-python/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    # Pinned: `ruff format --check` must see the formatter the tree was formatted with.
    "ruff==0.16.8",
]

[project.scripts]
sm83-python = "sm83_python.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sm83_python"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["reference", "docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PERF", "RUF"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["sm83_python"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
pythonpath = ["src", "."]
markers = [
    "slow: an external-oracle corpus run; `pytest -m \"not slow\"` is the quick loop",
]
